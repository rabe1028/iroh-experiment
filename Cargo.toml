[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/baseline",
    "crates/tcp-tunnel",
    "crates/cloudflare-stun",
    "crates/media-separation",
    "crates/cloudflare-h3-observer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rabe1028/iroh-experiment"

[workspace.dependencies]
iroh = "=1.0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tokio-stream = "0.1"
